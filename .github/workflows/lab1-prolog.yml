name: Lab 1 Validation

on:
  push:
    branches:
      - main
    paths:
      - 'lab1/**'
      - '.github/workflows/lab1-prolog.yml'
  pull_request:
    paths:
      - 'lab1/**'
      - '.github/workflows/lab1-prolog.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes swi-prolog-nox libxml2-utils ripgrep
      - name: Run Lab 1 tests
        run: |
          swipl -q -s lab1/prolog/test/run_tests.pl
          swipl -q -s lab1/defense/run_prolog_examples.pl
          bash lab1/ontology/test/validate_ontology.sh
